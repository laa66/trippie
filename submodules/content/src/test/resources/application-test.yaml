# `test` profile, active for all Gradle test tasks (SPRING_PROFILES_ACTIVE=test, set in
# build.gradle.kts). Overlays the base application.yaml; only the test-only relaxations live here:
# startup Flyway off, the DB health contributor off and the broker on a closed port, so context
# tests run without a database or a broker. The integration tests re-point the datasource
# and the broker and re-enable Flyway via @DynamicPropertySource (highest precedence).
spring:
  flyway:
    enabled: false
  rabbitmq:
    host: 127.0.0.1
    port: 1

management:
  health:
    db:
      enabled: false
