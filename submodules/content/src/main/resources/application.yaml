spring:
  application:
    name: content
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/content_db}
    username: ${SPRING_DATASOURCE_USERNAME:trippie}
    password: ${SPRING_DATASOURCE_PASSWORD:trippie}
  flyway:
    enabled: true
    locations: classpath:db/migration

# Outbound dependency on spatial, the unlock gate in front of reading and generating content. The
# URI is the only tunable here; the request timeout is a constant in ContentConfig, which says why.
trippie:
  spatial:
    # Service root inside the compose network: the gateway's StripPrefix=2 applies only to traffic
    # entering from outside, so the path on this client is plainly /locations/...
    uri: ${SPATIAL_URI:http://spatial:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
