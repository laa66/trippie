spring:
  application:
    name: spatial
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/spatial_db}
    username: ${SPRING_DATASOURCE_USERNAME:trippie}
    password: ${SPRING_DATASOURCE_PASSWORD:trippie}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
