# `test` profile, active for all Gradle test tasks (SPRING_PROFILES_ACTIVE=test, set in
# build.gradle.kts). Points the broker at a closed port so context tests run without Docker; the
# integration tests re-point it via @DynamicPropertySource (highest precedence).
spring:
  rabbitmq:
    host: 127.0.0.1
    port: 1

# A fake key, so the listener starts as in production. Relative to the module directory, which is
# Gradle's working directory for tests. The no-key path is tested by overriding this property.
trippie:
  gemini:
    api-key-file: src/test/resources/fake-gemini.key
    base-url: http://127.0.0.1:1
