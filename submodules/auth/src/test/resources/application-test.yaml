# `test` profile, active for all Gradle test tasks (SPRING_PROFILES_ACTIVE=test, set in
# build.gradle.kts). Overlays the base application.yaml instead of shadowing it, so datasource,
# virtual threads and management config are inherited from main. Only the two test-only
# relaxations live here: startup Flyway off and the DB health contributor off, so the M2-01
# context and health tests run without a live database. The migration IT drives Flyway against
# Testcontainers directly through the Flyway API, so it does not depend on this profile.
spring:
  flyway:
    enabled: false
  jpa:
    # Pin the dialect so Hibernate boots the EntityManagerFactory without probing a live
    # connection for JDBC metadata — keeps the M2-01 context/health tests database-less. The
    # M2-03 IT re-points the datasource + re-enables Flyway against a real container.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false

management:
  health:
    db:
      enabled: false
    # Redis health probes a live connection; off here so the context/health tests need no Redis.
    # The M2-03 IT points at a real Redis container regardless of this contributor.
    redis:
      enabled: false
