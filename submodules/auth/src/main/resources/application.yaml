spring:
  application:
    name: auth
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:trippie}
    password: ${SPRING_DATASOURCE_PASSWORD:trippie}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # Flyway owns the schema; Hibernate must never touch DDL. open-in-view off keeps the
    # persistence context scoped to the service transaction, not the whole request.
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

auth:
  jwt:
    # External EC P-256 JWK (private material). Provisioned by M2-13 (make auth-keys -> gitignored
    # file, mounted here); startup fails fast if unset/absent/malformed. Never committed.
    jwk-path: ${AUTH_JWT_JWK_PATH:}
    issuer: ${AUTH_JWT_ISSUER:https://auth.trippie.local}
    access-token-ttl: ${AUTH_JWT_ACCESS_TOKEN_TTL:15m}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
