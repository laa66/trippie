# Single browser-facing origin for the trippie deliverable. This nginx serves the
# built SPA and reverse-proxies every other concern to the internal compose
# services, so the browser (on the host) only ever talks to localhost:8080.
server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA static assets + client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API traffic -> gateway. The full /api/** path is preserved; the gateway
    # strips the /api/<service> prefix before forwarding downstream.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # M0 deliverable: prove the gui -> gateway -> spatial health hop from one
    # origin. The gateway routes /health to spatial (its own liveness is at
    # /actuator/health).
    location = /health {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Self-hosted map assets -> tileserver-gl. tileserver rewrites the URLs inside
    # style.json / tilejson to absolute ones based on Host + X-Forwarded-Proto, so
    # these MUST be forwarded as the browser-facing origin (localhost:8080),
    # otherwise the emitted URLs would point at the unreachable service name.
    location /styles/ {
        proxy_pass http://tileserver-gl:8080;
        # $http_host (not $host) so the browser-facing port (:8080) is preserved
        # in the URLs tileserver rewrites into style.json / tilejson.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /data/ {
        proxy_pass http://tileserver-gl:8080;
        # $http_host (not $host) so the browser-facing port (:8080) is preserved
        # in the URLs tileserver rewrites into style.json / tilejson.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fonts/ {
        proxy_pass http://tileserver-gl:8080;
        # $http_host (not $host) so the browser-facing port (:8080) is preserved
        # in the URLs tileserver rewrites into style.json / tilejson.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
