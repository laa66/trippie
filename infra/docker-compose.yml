# trippie — full local assembly (M0 deliverable, M0-08; M1 backend, M1-08; M2 auth, M2-13).
#
# `docker compose -f infra/docker-compose.yml up --build` brings up the full
# M2 backend stack: self-hosted tiles (tileserver-gl), postgres (PostGIS), redis
# and app services (spatial, auth, gateway, gui). spatial and auth wait for
# postgres to be healthy (auth also waits for redis) and run their own Flyway
# migrations on startup; gateway waits for auth. rabbitmq is not needed yet — it
# sits behind the `infra` profile and stays off by default. Add it with
# `--profile infra`.
#
# Single browser-facing origin: only the gui (nginx) publishes a host port
# (8080). The browser runs on the host, outside the compose network, so it talks
# to ONE origin — the gui — which serves the SPA and reverse-proxies /api,
# /health and the tileserver asset paths to the internal services. gateway,
# spatial and tileserver-gl are internal-only (reachable via compose DNS); auth
# also gets a loopback-bound debug port (see below) but is otherwise reached the
# same way, via the gateway.
#
# Services reach each other by compose service name (DNS): postgres, redis,
# rabbitmq, tileserver-gl, spatial, auth, gateway.
# Credentials here are DEV-ONLY defaults for local infra — not secrets. The auth
# signing key is the exception: it is real key material, generated by
# `make auth-keys` into the gitignored infra/auth-keys/ (never committed, never
# baked into the image).

name: trippie

services:
  postgres:
    # PostGIS-capable Postgres. Pinned to match the spatial stack (PG18 + PostGIS 3.6).
    image: postgis/postgis:18-3.6-alpine
    container_name: trippie-postgres
    environment:
      POSTGRES_USER: trippie
      POSTGRES_PASSWORD: trippie
      # Neutral default DB; the three logical DBs are created by the init script so
      # CREATE DATABASE does not collide with the entrypoint's own DB creation.
      POSTGRES_DB: postgres
    ports:
      # dev-only: bound to loopback so it is reachable from the host for debugging
      # but never exposed on the LAN. App services reach it via compose DNS.
      # Overridable so a native Postgres on the host doesn't clash.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready hits the init
      # server's unix socket (listen_addresses='') and reports healthy before
      # 01-init-databases.sql has created spatial_db and before real TCP:5432
      # is listening — a race that lets spatial's Flyway start against a DB
      # that doesn't exist yet.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trippie -d spatial_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trippie

  redis:
    # Unprofiled in M2 (M2-13): auth needs it (refresh store, jti denylist, OTP
    # store) and the gateway needs it (jti denylist check), so it is now part of
    # the default `make up` stack, not behind `--profile infra`.
    image: redis:7.4-alpine
    container_name: trippie-redis
    ports:
      # dev-only: loopback-bound, overridable (see postgres).
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - trippie

  rabbitmq:
    # -management gives the UI (15672) + rabbitmq-diagnostics for the healthcheck.
    # Official RabbitMQ images are debian-based (no alpine variant).
    image: rabbitmq:4.0-management
    container_name: trippie-rabbitmq
    profiles: [infra]
    environment:
      RABBITMQ_DEFAULT_USER: trippie
      RABBITMQ_DEFAULT_PASS: trippie
    ports:
      # dev-only: loopback-bound, overridable (see postgres).
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"            # AMQP
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"     # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - trippie

  tileserver-gl:
    # Serves the Planetiler-generated Wroclaw seed (OpenMapTiles schema) as vector
    # tiles + a renderable style.json. Style ("basic-preview") and glyphs ("Noto Sans
    # Regular") are bundled in the image (tileserver-gl-styles) — no external assets.
    # The mbtiles is produced out-of-band by `make tiles` (see repo-root Makefile) and
    # must exist before this service starts.
    # Internal-only: assets are reverse-proxied to the browser through the gui.
    image: maptiler/tileserver-gl:v5.2.0
    container_name: trippie-tileserver-gl
    command: ["--config", "/data/config.json", "--port", "8080"]
    volumes:
      - ./tiles/config.json:/data/config.json:ro
      - ./tiles/wroclaw.mbtiles:/data/wroclaw.mbtiles:ro
    healthcheck:
      # Image ships node only (no curl/wget); hit tileserver-gl's own /health.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trippie

  spatial:
    # Composite gradle build (includeBuild ../commons) -> context is submodules/.
    # M1: datasource points at the postgres service; Flyway migrates on startup,
    # so spatial must not start until postgres is healthy.
    build:
      context: ../submodules
      dockerfile: spatial/Dockerfile
    container_name: trippie-spatial
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spatial_db
      SPRING_DATASOURCE_USERNAME: trippie
      SPRING_DATASOURCE_PASSWORD: trippie
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trippie

  auth:
    # Composite gradle build (includeBuild ../commons) -> context is submodules/.
    # Owns auth_db via Flyway; needs redis for the refresh-token store, jti
    # denylist and OTP store (M2). ES256 signing key is external, dev-only, never
    # baked into the image — generated by `make auth-keys` and mounted read-only.
    # AUTH_JWT_ISSUER must match the gateway's AUTH_JWT_ISSUER below exactly.
    build:
      context: ../submodules
      dockerfile: auth/Dockerfile
    container_name: trippie-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: trippie
      SPRING_DATASOURCE_PASSWORD: trippie
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AUTH_JWT_JWK_PATH: /keys/dev-jwk.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.trippie.local}
      # Cookies over plain http in local dev (gui is not TLS-terminated); real
      # deployments must not set this.
      AUTH_COOKIES_SECURE: "false"
    volumes:
      - ./auth-keys:/keys:ro
    ports:
      # dev-only: loopback-bound, overridable (see postgres). Not part of the
      # browser-facing path (that's via the gateway/gui) — for local debugging
      # only, e.g. curling /.well-known/jwks.json or /health directly.
      - "127.0.0.1:${AUTH_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trippie

  gateway:
    # Composite gradle build (includeBuild ../commons) -> context is submodules/.
    # Routes /health -> spatial, /api/spatial/** -> spatial and /api/auth/** ->
    # auth (all StripPrefix=2). Its OWN liveness is /actuator/health ( /health is
    # proxied to spatial ). Validates JWTs against auth's JWKS and checks the jti
    # denylist in redis. AUTH_JWT_ISSUER must match auth's AUTH_JWT_ISSUER above.
    build:
      context: ../submodules
      dockerfile: gateway/Dockerfile
    container_name: trippie-gateway
    environment:
      SPATIAL_URI: http://spatial:8080
      AUTH_URI: http://auth:8080
      AUTH_JWKS_URI: http://auth:8080/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.trippie.local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      spatial:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trippie

  gui:
    # Built SPA served by nginx, which is also the single browser-facing origin:
    # reverse-proxies /api + /health -> gateway and /styles,/data,/fonts ->
    # tileserver-gl. VITE_TILES_URL is empty so the map style is fetched
    # origin-relative through this proxy.
    build:
      context: ../submodules/gui
      dockerfile: Dockerfile
      args:
        VITE_TILES_URL: ""
    container_name: trippie-gui
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
      tileserver-gl:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - trippie

  spatial-loader:
    # One-shot POI ingest CLI (M1-04). Tools-profile: never started by `make up`,
    # only invoked via `docker compose run --rm` from `make load-pois`.
    build:
      context: ../submodules/spatial-loader
      dockerfile: Dockerfile
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://trippie:trippie@postgres:5432/spatial_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trippie

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  trippie:
    name: trippie
